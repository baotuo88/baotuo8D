services:
  postgres:
    image: postgres:16-alpine
    container_name: eightd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eightd_ai}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-eightd_ai}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    profiles: ["dev", "prod"]

  chroma:
    image: chromadb/chroma:0.6.3
    container_name: eightd-chroma
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
      ALLOW_RESET: "FALSE"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v2/heartbeat', timeout=3)\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    profiles: ["dev", "prod"]

  redis:
    image: redis:7-alpine
    container_name: eightd-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    profiles: ["dev", "prod"]

  migrator:
    build:
      context: ./backend
    container_name: eightd-migrator
    restart: "no"
    command: ["npm", "run", "migrate"]
    environment:
      NODE_ENV: production
      SERVICE_NAME: ${BACKEND_SERVICE_NAME:-eightd-backend}-migrator
      PORT: 8080
      LOG_LEVEL: ${BACKEND_LOG_LEVEL:-info}
      LOG_PRETTY: ${BACKEND_LOG_PRETTY:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://127.0.0.1:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-eightd_ai}
      CHROMA_URL: http://chroma:8000
      CHROMA_COLLECTION: ${CHROMA_COLLECTION:-eight_d_reports}
      CHROMA_RAG_COLLECTION: ${CHROMA_RAG_COLLECTION:-rag_case_chunks}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET}
      SECRET_CRYPTO_KEY: ${SECRET_CRYPTO_KEY}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      ADMIN_REGISTER_TOKEN: ${ADMIN_REGISTER_TOKEN:-}
      DOCUMENT_UPLOAD_DIR: ${DOCUMENT_UPLOAD_DIR:-/tmp/8d-doc-upload}
      DOCUMENT_IMPORT_ROOT: ${DOCUMENT_IMPORT_ROOT:-/tmp}
      DOCUMENT_BATCH_CONCURRENCY: ${DOCUMENT_BATCH_CONCURRENCY:-4}
      DOCUMENT_MAX_UPLOAD_FILES: ${DOCUMENT_MAX_UPLOAD_FILES:-50}
      DOCUMENT_MAX_IMPORT_FILES: ${DOCUMENT_MAX_IMPORT_FILES:-1000}
      DOCUMENT_MAX_UPLOAD_FILE_SIZE_MB: ${DOCUMENT_MAX_UPLOAD_FILE_SIZE_MB:-20}
      RAG_CHUNK_MIN_CHARS: ${RAG_CHUNK_MIN_CHARS:-300}
      RAG_CHUNK_MAX_CHARS: ${RAG_CHUNK_MAX_CHARS:-500}
      RAG_RECALL_LIMIT: ${RAG_RECALL_LIMIT:-10}
      RAG_TOP_CASE_LIMIT: ${RAG_TOP_CASE_LIMIT:-3}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      HEALTHCHECK_TIMEOUT_MS: ${HEALTHCHECK_TIMEOUT_MS:-3000}
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    profiles: ["dev", "prod"]

  backend:
    build:
      context: ./backend
    container_name: eightd-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERVICE_NAME: ${BACKEND_SERVICE_NAME:-eightd-backend}
      PORT: 8080
      LOG_LEVEL: ${BACKEND_LOG_LEVEL:-info}
      LOG_PRETTY: ${BACKEND_LOG_PRETTY:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://127.0.0.1:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-eightd_ai}
      CHROMA_URL: http://chroma:8000
      CHROMA_COLLECTION: ${CHROMA_COLLECTION:-eight_d_reports}
      CHROMA_RAG_COLLECTION: ${CHROMA_RAG_COLLECTION:-rag_case_chunks}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET}
      SECRET_CRYPTO_KEY: ${SECRET_CRYPTO_KEY}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      ADMIN_REGISTER_TOKEN: ${ADMIN_REGISTER_TOKEN:-}
      DOCUMENT_UPLOAD_DIR: ${DOCUMENT_UPLOAD_DIR:-/tmp/8d-doc-upload}
      DOCUMENT_IMPORT_ROOT: ${DOCUMENT_IMPORT_ROOT:-/tmp}
      DOCUMENT_BATCH_CONCURRENCY: ${DOCUMENT_BATCH_CONCURRENCY:-4}
      DOCUMENT_MAX_UPLOAD_FILES: ${DOCUMENT_MAX_UPLOAD_FILES:-50}
      DOCUMENT_MAX_IMPORT_FILES: ${DOCUMENT_MAX_IMPORT_FILES:-1000}
      DOCUMENT_MAX_UPLOAD_FILE_SIZE_MB: ${DOCUMENT_MAX_UPLOAD_FILE_SIZE_MB:-20}
      RAG_CHUNK_MIN_CHARS: ${RAG_CHUNK_MIN_CHARS:-300}
      RAG_CHUNK_MAX_CHARS: ${RAG_CHUNK_MAX_CHARS:-500}
      RAG_RECALL_LIMIT: ${RAG_RECALL_LIMIT:-10}
      RAG_TOP_CASE_LIMIT: ${RAG_TOP_CASE_LIMIT:-3}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      HEALTHCHECK_TIMEOUT_MS: ${HEALTHCHECK_TIMEOUT_MS:-3000}
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      chroma:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    profiles: ["dev", "prod"]

  worker:
    build:
      context: ./backend
    container_name: eightd-worker
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    environment:
      NODE_ENV: production
      SERVICE_NAME: ${BACKEND_SERVICE_NAME:-eightd-backend}-worker
      PORT: 8080
      LOG_LEVEL: ${BACKEND_LOG_LEVEL:-info}
      LOG_PRETTY: ${BACKEND_LOG_PRETTY:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://127.0.0.1:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-eightd_ai}
      CHROMA_URL: http://chroma:8000
      CHROMA_COLLECTION: ${CHROMA_COLLECTION:-eight_d_reports}
      CHROMA_RAG_COLLECTION: ${CHROMA_RAG_COLLECTION:-rag_case_chunks}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-25000}
      AI_RETRY_COUNT: ${AI_RETRY_COUNT:-1}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      QUEUE_RAG_INGESTION_NAME: ${QUEUE_RAG_INGESTION_NAME:-rag-ingestion}
      QUEUE_RAG_INGESTION_CONCURRENCY: ${QUEUE_RAG_INGESTION_CONCURRENCY:-2}
      QUEUE_RAG_INGESTION_ATTEMPTS: ${QUEUE_RAG_INGESTION_ATTEMPTS:-3}
      JWT_SECRET: ${JWT_SECRET}
      SECRET_CRYPTO_KEY: ${SECRET_CRYPTO_KEY}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      ADMIN_REGISTER_TOKEN: ${ADMIN_REGISTER_TOKEN:-}
      DOCUMENT_UPLOAD_DIR: ${DOCUMENT_UPLOAD_DIR:-/tmp/8d-doc-upload}
      DOCUMENT_IMPORT_ROOT: ${DOCUMENT_IMPORT_ROOT:-/tmp}
      DOCUMENT_BATCH_CONCURRENCY: ${DOCUMENT_BATCH_CONCURRENCY:-4}
      DOCUMENT_MAX_UPLOAD_FILES: ${DOCUMENT_MAX_UPLOAD_FILES:-50}
      DOCUMENT_MAX_IMPORT_FILES: ${DOCUMENT_MAX_IMPORT_FILES:-1000}
      DOCUMENT_MAX_UPLOAD_FILE_SIZE_MB: ${DOCUMENT_MAX_UPLOAD_FILE_SIZE_MB:-20}
      RAG_CHUNK_MIN_CHARS: ${RAG_CHUNK_MIN_CHARS:-300}
      RAG_CHUNK_MAX_CHARS: ${RAG_CHUNK_MAX_CHARS:-500}
      RAG_RECALL_LIMIT: ${RAG_RECALL_LIMIT:-10}
      RAG_TOP_CASE_LIMIT: ${RAG_TOP_CASE_LIMIT:-3}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      HEALTHCHECK_TIMEOUT_MS: ${HEALTHCHECK_TIMEOUT_MS:-3000}
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      chroma:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q '[r]agIngestionWorker.js' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    profiles: ["dev", "prod"]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api}
    container_name: eightd-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:4173"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4173/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    profiles: ["dev", "prod"]

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: eightd-prometheus
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - ./deploy/monitoring/secrets/metrics_token:/run/secrets/metrics_token:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pg_data:
  chroma_data:
  prometheus_data:
