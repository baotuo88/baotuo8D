name: ci

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eightd_ai
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eightd_ai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      chroma:
        image: chromadb/chroma:0.6.3
        ports:
          - 8000:8000

    env:
      NODE_ENV: test
      PORT: 8080
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/eightd_ai
      REDIS_URL: redis://127.0.0.1:6379
      CHROMA_URL: http://127.0.0.1:8000
      CHROMA_COLLECTION: eight_d_reports
      CHROMA_RAG_COLLECTION: rag_case_chunks
      OPENAI_API_KEY: test-key
      OPENAI_BASE_URL: https://api.openai.com/v1
      OPENAI_MODEL: gpt-4o-mini
      EMBEDDING_MODEL: text-embedding-3-small
      JWT_SECRET: this_is_a_ci_test_secret_with_enough_length_123456
      JWT_EXPIRES_IN: 12h
      BCRYPT_SALT_ROUNDS: 10
      SECURITY_ENABLE_HELMET: true
      SECURITY_GLOBAL_RATE_WINDOW_MS: 60000
      SECURITY_GLOBAL_RATE_MAX: 300
      SECURITY_AUTH_RATE_WINDOW_MS: 60000
      SECURITY_AUTH_RATE_MAX: 20
      HEALTHCHECK_TIMEOUT_MS: 5000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Backend static checks
        working-directory: backend
        run: npm run check

      - name: Run migrations
        working-directory: backend
        run: npm run migrate

      - name: Start backend
        working-directory: backend
        run: |
          nohup npm start > /tmp/backend.log 2>&1 &
          sleep 5

      - name: Run smoke test
        working-directory: backend
        run: npm run smoke

      - name: Run integration tests
        working-directory: backend
        run: npm run test:integration

      - name: Print backend log on failure
        if: failure()
        run: cat /tmp/backend.log || true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
