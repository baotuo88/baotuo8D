# Public reverse proxy template for eightd
# Goal: expose app APIs/pages, block direct /metrics access from public internet.

server {
  listen 80;
  server_name your-domain.com;

  # Public app traffic
  location / {
    proxy_pass http://frontend:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
  }

  # If backend is directly proxied by edge nginx, keep health internal-only or behind ACL.
  location = /api/health {
    allow 127.0.0.1;
    deny all;
    proxy_pass http://backend:8080/api/health;
  }

  # Block metrics from public internet
  location = /metrics {
    deny all;
    return 403;
  }
}
