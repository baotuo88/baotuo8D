apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eightd-public
  annotations:
    nginx.ingress.kubernetes.io/server-snippet: |
      location = /metrics {
        deny all;
        return 403;
      }
spec:
  ingressClassName: nginx
  rules:
    - host: your-domain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eightd-frontend
                port:
                  number: 80
