global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  - job_name: "eightd-backend"
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:8080
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
